<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a notebook that loses its ink. Shelf of notebooks → one notebook at a time, cells top to bottom,
   blanks drawn as highlighter strips. Teal ink for what you know, yellow marker for what you must rebuild. */
:root {
  --paper: #f3f4f1;
  --sheet: #ffffff;
  --ink: #161b20;
  --ink-2: #5d6873;
  --rule: #dcdfdb;
  --teal: #0b6b68;
  --teal-soft: #dff1ef;
  --marker: #ffe36e;
  --marker-ink: #5c4a00;
  --good: #187344;
  --bad: #b22a2f;
  --bad-soft: #fbe7e7;
  --code-bg: #f7f8f6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101418; --sheet: #171c21; --ink: #e6eaee; --ink-2: #93a0ac; --rule: #283039;
    --teal: #4fc9c0; --teal-soft: #15302f; --marker: #5b4d12; --marker-ink: #ffe9a0;
    --good: #59c98f; --bad: #ff7d7d; --bad-soft: #3a1b1d; --code-bg: #12171c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101418; --sheet: #171c21; --ink: #e6eaee; --ink-2: #93a0ac; --rule: #283039;
  --teal: #4fc9c0; --teal-soft: #15302f; --marker: #5b4d12; --marker-ink: #ffe9a0;
  --good: #59c98f; --bad: #ff7d7d; --bad-soft: #3a1b1d; --code-bg: #12171c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 64px; }
.hidden { display: none !important; }
code { font-family: var(--font-code); font-size: 0.88em; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }

/* header */
header.top { display: flex; align-items: center; gap: 16px 28px; flex-wrap: wrap; padding: 20px 0 18px; }
.mark { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; cursor: pointer; background: none; border: 0; padding: 0; line-height: 1; }
.mark span:nth-child(1) { opacity: 1; } .mark span:nth-child(2) { opacity: .78; } .mark span:nth-child(3) { opacity: .55; } .mark span:nth-child(4) { opacity: .32; }
nav.tabs { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--teal); }
.engine { font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); display: inline-block; }
.dot.ok { background: var(--good); } .dot.wait { background: #d39b19; } .dot.off { background: var(--bad); }

/* shelf */
.intro { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: end; margin: 6px 0 26px; }
@media (max-width: 800px) { .intro { grid-template-columns: 1fr; } }
.intro h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); line-height: 1.08; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.intro h1 em { font-style: normal; color: var(--teal); }
.intro p { margin: 10px 0 0; color: var(--ink-2); max-width: 60ch; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rung { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.rung b { display: block; font-size: 13px; }
.rung .demo { font-family: var(--font-code); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; color: var(--ink-2); }
.hl { background: var(--marker); color: var(--marker-ink); border-radius: 2px; }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 26px 0 10px; }
.section-head h2 { font-family: var(--font-display); font-size: 21px; margin: 0; letter-spacing: -0.01em; }
.section-head .muted { font-size: 13px; }
.section-head .spacer { flex: 1; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.nb-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 172px; }
.nb-card:hover { border-color: var(--ink-2); }
.nb-card h3 { font-family: var(--font-display); font-size: 16.5px; margin: 0; line-height: 1.25; }
.nb-card .data { font-size: 12.5px; color: var(--ink-2); }
.print { display: flex; flex-direction: column; gap: 3px; margin-top: auto; }
.print i { display: block; height: 4px; border-radius: 2px; background: var(--ink); }
.card-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-2); gap: 6px; }
.steps { display: inline-flex; gap: 3px; }
.steps s { width: 14px; height: 5px; border-radius: 3px; background: var(--rule); text-decoration: none; display: inline-block; }
.steps s.on { background: var(--teal); }
.due { color: var(--teal); font-weight: 600; }
.lib { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--teal); }
.upload-card { border-style: dashed; justify-content: center; align-items: center; text-align: center; color: var(--ink-2); }
.upload-card b { color: var(--ink); font-family: var(--font-display); font-size: 16px; }

/* buttons */
.btn { border: 1px solid var(--rule); background: var(--sheet); padding: 7px 13px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
:root[data-theme="dark"] .btn.teal { color: #0d1513; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.teal { color: #0d1513; } }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--ink-2); }
.kbd { font-family: var(--font-code); font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink-2); }

/* notebook */
.nb-head { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 12px 0; border-bottom: 1px solid var(--rule); margin-bottom: 18px; display: flex; gap: 14px 20px; align-items: center; flex-wrap: wrap; }
.nb-head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.nb-head .spacer { flex: 1; }
.stage-pick { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.stage-pick button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--rule); }
.stage-pick button:last-child { border-right: 0; }
.stage-pick button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stage-pick button:disabled { cursor: not-allowed; opacity: .4; }
.meter { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter b { color: var(--ink); }
.cell { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 10px; margin-bottom: 14px; }
.gutter { font-family: var(--font-code); font-size: 11.5px; color: var(--ink-2); text-align: right; padding-top: 10px; }
.gutter.done { color: var(--good); }
.md { grid-column: 2; font-size: 15px; margin: 4px 0 -2px; max-width: 72ch; }
.code-box { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.code-box.active { border-color: var(--ink-2); box-shadow: 0 1px 0 var(--rule); }
.code-box.passed { border-left: 3px solid var(--good); }
.code-box.peeked { border-left: 3px solid var(--bad); }
pre.code { margin: 0; padding: 10px 14px; font-family: var(--font-code); font-size: 13.5px; line-height: 1.6; overflow-x: auto; white-space: pre; tab-size: 4; }
.tok-k { color: #8a3ffc; } .tok-s { color: #1a7f37; } .tok-n { color: #b35900; } .tok-c { color: var(--ink-2); font-style: italic; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tok-k { color: #c39bff; } :root:not([data-theme="light"]) .tok-s { color: #7ee2a8; } :root:not([data-theme="light"]) .tok-n { color: #ffb86b; } }
:root[data-theme="dark"] .tok-k { color: #c39bff; } :root[data-theme="dark"] .tok-s { color: #7ee2a8; } :root[data-theme="dark"] .tok-n { color: #ffb86b; }
input.blank { font-family: var(--font-code); font-size: 13.5px; background: var(--marker); color: var(--marker-ink); border: 0; border-bottom: 2px solid var(--marker-ink); border-radius: 2px; padding: 0 3px; margin: 0 1px; min-width: 3ch; }
input.blank:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
textarea.strip, textarea.full { display: block; width: 100%; font-family: var(--font-code); font-size: 13.5px; line-height: 1.6; background: var(--marker); color: var(--marker-ink); border: 0; border-radius: 3px; padding: 4px 8px; resize: vertical; white-space: pre; overflow: auto; tab-size: 4; }
textarea.full { min-height: 96px; border-radius: 0; padding: 10px 14px; }
textarea.strip::placeholder, textarea.full::placeholder { color: var(--marker-ink); opacity: .55; }
.cell-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-top: 1px dashed var(--rule); background: var(--code-bg); font-size: 13px; }
.cell-bar .spacer { flex: 1; }
.creates { font-size: 12.5px; color: var(--ink-2); }
.out { border-top: 1px solid var(--rule); padding: 8px 14px; }
.out .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }
.out pre { margin: 0; font-family: var(--font-code); font-size: 12.5px; line-height: 1.45; overflow: auto; max-height: 260px; white-space: pre; }
.out.target pre { opacity: .7; }
.verdict { padding: 8px 14px; border-top: 1px solid var(--rule); font-size: 14px; }
.verdict.bad { background: var(--bad-soft); }
.verdict .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
@media (max-width: 640px) { .verdict .cmp { grid-template-columns: 1fr; } .cell { grid-template-columns: 1fr; } .gutter { text-align: left; padding: 0; } .md { grid-column: 1; } }
.verdict .cmp pre { margin: 0; font-family: var(--font-code); font-size: 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; overflow: auto; max-height: 180px; }
.verdict small { color: var(--ink-2); font-size: 12px; }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip { font-family: var(--font-code); font-size: 12px; background: var(--teal-soft); color: var(--teal); padding: 1px 7px; border-radius: 5px; }
.stamp { font-size: 12px; font-weight: 600; color: var(--good); }
.stamp.peek { color: var(--bad); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--rule); border-top-color: var(--teal); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 22px; }
.panel h2 { font-family: var(--font-display); font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
.big { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 14px 0; }
.stat { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--ink-2); font-size: 12.5px; }

/* interview */
.room { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 18px; align-items: start; }
@media (max-width: 760px) { .room { grid-template-columns: 1fr; } }
.ask { font-family: var(--font-display); font-size: 23px; line-height: 1.3; margin: 6px 0 14px; text-wrap: balance; }
.who { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); }
.clock { text-align: center; }
.clock svg { width: 150px; height: 150px; }
.clock .t { font-family: var(--font-code); font-size: 26px; font-variant-numeric: tabular-nums; }
.q-list { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; }
.q-list li { padding: 4px 0; color: var(--ink-2); display: flex; gap: 6px; }
.q-list li.now { color: var(--ink); font-weight: 600; }
textarea.answer { width: 100%; min-height: 130px; font-family: var(--font-code); font-size: 13.5px; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; resize: vertical; tab-size: 4; }
textarea.answer.prose { font-family: var(--font-body); font-size: 15px; }
.model { border-left: 3px solid var(--teal); padding: 6px 12px; margin-top: 10px; background: var(--teal-soft); border-radius: 0 6px 6px 0; }
table.list { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.list th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); border-bottom: 1px solid var(--rule); padding: 6px 8px; font-weight: 600; }
table.list td { border-bottom: 1px solid var(--rule); padding: 7px 8px; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.drop { border: 2px dashed var(--rule); border-radius: 12px; padding: 30px; text-align: center; background: var(--sheet); }
.drop.over { border-color: var(--teal); background: var(--teal-soft); }
.note { font-size: 13px; color: var(--ink-2); }
.err { color: var(--bad); }
.sprint-ctx { font-size: 12.5px; color: var(--ink-2); margin: 0 0 4px 62px; }
@media (max-width: 640px) { .sprint-ctx { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="mark" id="home-link" aria-label="Fade home"><span>f</span><span>a</span><span>d</span><span>e</span></button>
    <nav class="tabs" aria-label="Sections">
      <button data-go="shelf" aria-current="true">Shelf</button>
      <button data-go="nb" id="tab-nb">Notebook</button>
      <button data-go="interview">Interview</button>
      <button data-go="upload">Add your notebook</button>
    </nav>
  </header>
  <main>
    <section id="v-shelf"></section>
    <section id="v-nb" class="hidden"></section>
    <section id="v-interview" class="hidden"></section>
    <section id="v-upload" class="hidden"></section>
    <section id="v-evals" class="hidden"></section>
  </main>
</div>

const KERNEL_SRC = "# Fade kernel: notebook analysis (what to fade) + a stateful runner + cell grader.\n# The same file runs offline (CPython, for evals) and in the browser (Pyodide).\nimport ast, copy, io, contextlib, traceback, types, json, os\nimport numpy as np\nimport pandas as pd\n\n# ------------------------------------------------------------------ analysis\nLOW_ATTRS = {'head', 'tail', 'print', 'copy', 'info', 'keys', 'values', 'items', 'append', 'format', 'join', 'split'}\nPLAIN_FUNCS = {'print', 'len', 'range', 'list', 'dict', 'int', 'float', 'str', 'round', 'sum', 'max', 'min', 'sorted',\n               'zip', 'enumerate', 'isinstance', 'type', 'set', 'tuple', 'abs', 'display', 'super', 'bool', 'repr'}\nHEAVY_MODULES = ('sklearn', 'scipy', 'torch', 'statsmodels')\n\n\ndef _char_col(line_text, byte_col):\n    return len(line_text.encode('utf-8')[:byte_col].decode('utf-8', 'ignore'))\n\n\ndef analyze(src):\n    \"\"\"Split a code cell into top-level statements and find the tokens worth blanking.\"\"\"\n    try:\n        tree = ast.parse(src)\n    except SyntaxError as e:\n        return {'ok': False, 'error': f'SyntaxError: {e.msg}', 'stmts': []}\n    lines = src.split('\\n')\n    stmts = []\n    for node in tree.body:\n        toks = []\n\n        def add(line, bcol, text, kind, weight):\n            lt = lines[line - 1]\n            col = _char_col(lt, bcol)\n            if lt[col:col + len(text)] == text:\n                toks.append(dict(line=line, col=col, text=text, kind=kind, w=weight))\n\n        for sub in ast.walk(node):\n            if isinstance(sub, ast.Call):\n                f = sub.func\n                if isinstance(f, ast.Attribute) and f.attr not in LOW_ATTRS:\n                    lt = lines[f.end_lineno - 1]\n                    ecol = _char_col(lt, f.end_col_offset)\n                    col = ecol - len(f.attr)\n                    if lt[col:ecol] == f.attr:\n                        toks.append(dict(line=f.end_lineno, col=col, text=f.attr, kind='method', w=3))\n                elif isinstance(f, ast.Name) and f.id not in PLAIN_FUNCS:\n                    add(f.lineno, f.col_offset, f.id, 'func', 2)\n                for kw in sub.keywords:\n                    if kw.arg:\n                        add(kw.lineno, kw.col_offset, kw.arg, 'kwarg', 3)\n                        v = kw.value\n                        if isinstance(v, ast.Constant) and isinstance(v.value, str) and 0 < len(v.value) <= 14:\n                            lt = lines[v.lineno - 1]\n                            c = _char_col(lt, v.col_offset)\n                            seg = lt[c:_char_col(lt, v.end_col_offset)] if v.end_lineno == v.lineno else ''\n                            if len(seg) >= 2 and seg[0] in '\\'\"':\n                                toks.append(dict(line=v.lineno, col=c + 1, text=seg[1:-1], kind='value', w=2))\n            elif isinstance(sub, ast.ImportFrom) and sub.module and sub.module.startswith(HEAVY_MODULES):\n                lt = lines[sub.lineno - 1]\n                c = lt.find(sub.module)\n                if c >= 0:\n                    toks.append(dict(line=sub.lineno, col=c, text=sub.module, kind='module', w=3))\n                for a in sub.names:\n                    add(a.lineno, a.col_offset, a.name, 'import', 3)\n        # dedupe by position\n        seen, uniq = set(), []\n        for t in sorted(toks, key=lambda t: (t['line'], t['col'])):\n            k = (t['line'], t['col'])\n            if k not in seen and t['text'].strip():\n                seen.add(k); uniq.append(t)\n        score = sum(t['w'] for t in uniq)\n        stmts.append(dict(start=node.lineno, end=node.end_lineno, tokens=uniq, score=score,\n                          src='\\n'.join(lines[node.lineno - 1:node.end_lineno])))\n    return {'ok': True, 'stmts': stmts}\n\n\n# ------------------------------------------------------------------ comparison\ndef _is_estimator(x):\n    return not isinstance(x, type) and hasattr(x, 'get_params') and hasattr(x, 'fit')\n\n\ndef _is_tool(x):\n    \"\"\"Imported classes/functions: a learner may import them differently, so they are not required by name.\"\"\"\n    return isinstance(x, (type, types.FunctionType, types.BuiltinFunctionType)) and getattr(x, '__module__', '') != '__main__'\n\n\ndef _short(e):\n    msg = [m for m in str(e).strip().splitlines() if m.strip()]\n    return ' '.join(msg[:3])[:300]\n\n\ndef _norm_frame(d):\n    d = d.copy()\n    for i in range(d.shape[1]):\n        if d.iloc[:, i].dtype == bool:\n            d.isetitem(i, d.iloc[:, i].astype(int))\n    d.columns = [str(c) for c in d.columns]\n    return d\n\n\nSKIP_FITTED = {'cv_results_', 'refit_time_', 'estimators_samples_'}\n\n\ndef _torchish(x):\n    return type(x).__module__.startswith('torch')\n\n\ndef compare(got, exp, depth=0):\n    \"\"\"Return (ok, message). Lenient on dtypes and float noise, strict on values and shape.\"\"\"\n    if depth > 6:\n        return True, ''\n    try:\n        if _torchish(exp):\n            if hasattr(exp, 'state_dict') and hasattr(exp, 'parameters'):\n                if type(got) is not type(exp):\n                    return False, f'expected a {type(exp).__name__}, got {type(got).__name__}'\n                return compare({k: v.detach().cpu().numpy() for k, v in got.state_dict().items()},\n                               {k: v.detach().cpu().numpy() for k, v in exp.state_dict().items()}, depth + 1)\n            if hasattr(exp, 'detach'):\n                if not hasattr(got, 'detach'):\n                    return False, f'expected a tensor, got {type(got).__name__}'\n                if got.dtype != exp.dtype:\n                    return False, f'dtype is {got.dtype}, expected {exp.dtype}'\n                return compare(got.detach().cpu().numpy(), exp.detach().cpu().numpy(), depth + 1)\n        if isinstance(exp, pd.DataFrame):\n            if isinstance(got, pd.Series) and exp.shape[1] == 1:\n                got = got.to_frame(exp.columns[0])\n            if not isinstance(got, pd.DataFrame):\n                return False, f'expected a DataFrame, got {type(got).__name__}'\n            if got.shape != exp.shape:\n                return False, f'shape is {got.shape}, expected {exp.shape}'\n            g, e = _norm_frame(got), _norm_frame(exp)\n            if list(g.columns) != list(e.columns):\n                if set(g.columns) == set(e.columns):\n                    return False, f'same columns but in a different order: {list(g.columns)}'\n                return False, f'columns are {list(g.columns)}, expected {list(e.columns)}'\n            pd.testing.assert_frame_equal(g, e, check_dtype=False, check_names=False, check_exact=False, rtol=1e-5,\n                                          check_index_type=False, check_column_type=False, check_categorical=False)\n            return True, ''\n        if isinstance(exp, pd.Series):\n            if isinstance(got, pd.DataFrame) and got.shape[1] == 1:\n                got = got.iloc[:, 0]\n            if not isinstance(got, pd.Series):\n                return False, f'expected a Series, got {type(got).__name__}'\n            if len(got) != len(exp):\n                return False, f'length is {len(got)}, expected {len(exp)}'\n            g = got.astype(int) if got.dtype == bool else got\n            e = exp.astype(int) if exp.dtype == bool else exp\n            pd.testing.assert_series_equal(g, e, check_dtype=False, check_names=False, check_exact=False, rtol=1e-5,\n                                           check_index_type=False, check_categorical=False)\n            return True, ''\n        if isinstance(exp, pd.Index):\n            ok = isinstance(got, pd.Index) and list(got) == list(exp)\n            return ok, '' if ok else 'index values differ'\n        if isinstance(exp, np.ndarray):\n            if isinstance(got, (pd.Series, pd.DataFrame, list, tuple)):\n                got = np.asarray(got)\n            if not isinstance(got, np.ndarray):\n                return False, f'expected an array, got {type(got).__name__}'\n            if got.shape != exp.shape:\n                return False, f'shape is {got.shape}, expected {exp.shape}'\n            if np.issubdtype(exp.dtype, np.number) and np.issubdtype(got.dtype, np.number):\n                if np.allclose(got, exp, rtol=1e-5, atol=1e-8, equal_nan=True):\n                    return True, ''\n                n = int((~np.isclose(got, exp, rtol=1e-5, atol=1e-8, equal_nan=True)).sum())\n                return False, f'same shape, but {n} value(s) differ'\n            return (np.array_equal(got, exp), '' if np.array_equal(got, exp) else 'values differ')\n        if _is_estimator(exp):\n            if type(got) is not type(exp):\n                return False, f'expected a {type(exp).__name__}, got {type(got).__name__}'\n            gp, ep = got.get_params(deep=False), exp.get_params(deep=False)\n            for k, v in ep.items():\n                ok, m = compare(gp.get(k), v, depth + 1)\n                if not ok:\n                    return False, f'{type(exp).__name__}({k}=...) differs: {m}'\n            for k in vars(exp):\n                if k.endswith('_') and not k.startswith('_') and k not in SKIP_FITTED:\n                    if not hasattr(got, k):\n                        return False, f'{type(exp).__name__} is not fitted the same way (missing {k})'\n                    ok, m = compare(getattr(got, k), getattr(exp, k), depth + 1)\n                    if not ok:\n                        return False, f'fitted {k} differs — was it fitted on the same data?'\n            return True, ''\n        if isinstance(exp, (types.FunctionType, type)):\n            return (callable(got), '' if callable(got) else 'expected a function')\n        if isinstance(exp, dict):\n            if not isinstance(got, dict) or set(got) != set(exp):\n                return False, 'dict keys differ'\n            for k in exp:\n                ok, m = compare(got[k], exp[k], depth + 1)\n                if not ok:\n                    return False, f'[{k!r}]: {m}'\n            return True, ''\n        if isinstance(exp, (tuple, list)):\n            if not isinstance(got, (tuple, list)) or len(got) != len(exp):\n                return False, f'expected a {type(exp).__name__} of length {len(exp)}'\n            for i, (a, b) in enumerate(zip(got, exp)):\n                ok, m = compare(a, b, depth + 1)\n                if not ok:\n                    return False, f'item {i}: {m}'\n            return True, ''\n        if isinstance(exp, (bool, np.bool_)):\n            return (bool(got) == bool(exp) and isinstance(got, (bool, np.bool_)), '' if got == exp else f'got {got}, expected {exp}')\n        if isinstance(exp, (int, float, np.integer, np.floating)):\n            if not isinstance(got, (int, float, np.integer, np.floating)) or isinstance(got, (bool, np.bool_)):\n                return False, f'expected a number, got {type(got).__name__}'\n            if np.isnan(float(exp)) and np.isnan(float(got)):\n                return True, ''\n            ok = bool(np.isclose(float(got), float(exp), rtol=1e-6, atol=1e-9))\n            return ok, '' if ok else f'got {_fmt_num(got)}, expected {_fmt_num(exp)}'\n        if exp is None:\n            return (got is None, '' if got is None else f'expected None, got {type(got).__name__}')\n        if isinstance(exp, str):\n            return (got == exp, '' if got == exp else 'text differs')\n        try:\n            if type(exp).__eq__ is not object.__eq__:\n                r = got == exp\n                if isinstance(r, (bool, np.bool_)):\n                    return bool(r), '' if r else 'values differ'\n        except Exception:\n            pass\n        if ' at 0x' in repr(exp):\n            if type(got) is not type(exp):\n                return False, f'expected a {type(exp).__name__}, got {type(got).__name__}'\n            ev = {k: v for k, v in getattr(exp, '__dict__', {}).items() if not k.startswith('_')}\n            gv = getattr(got, '__dict__', {})\n            for k, v in ev.items():\n                if isinstance(v, (bool, int, float, str, type(None))):\n                    if gv.get(k) != v:\n                        return False, f'{type(exp).__name__}.{k} is {gv.get(k)!r}, expected {v!r}'\n                elif hasattr(v, '__dict__') and not callable(v) and type(gv.get(k)) is not type(v):\n                    return False, f'{type(exp).__name__}.{k} is a {type(gv.get(k)).__name__}, expected {type(v).__name__}'\n            return True, ''\n        return (repr(got) == repr(exp), '' if repr(got) == repr(exp) else 'values differ')\n    except AssertionError as e:\n        return False, 'values differ — ' + _short(e)\n    except Exception as e:\n        return False, f'could not compare ({type(e).__name__})'\n\n\ndef _fmt_num(x):\n    x = float(x)\n    return f'{x:.6g}'\n\n\n# ------------------------------------------------------------------ display\ndef show(v, max_rows=10):\n    if v is None:\n        return ''\n    try:\n        with pd.option_context('display.width', 110, 'display.max_columns', 12, 'display.max_rows', max_rows,\n                               'display.min_rows', max_rows, 'display.max_colwidth', 28):\n            if isinstance(v, (pd.DataFrame, pd.Series)):\n                s = v.to_string(max_rows=max_rows, max_cols=12) if len(v) > 0 else repr(v)\n                if isinstance(v, pd.DataFrame):\n                    s += f'\\n\\n[{v.shape[0]} rows x {v.shape[1]} columns]' if v.shape[0] > max_rows else ''\n                return s\n            if isinstance(v, np.ndarray):\n                return np.array2string(v, precision=4, threshold=80, suppress_small=True) + f'   shape={v.shape}'\n            if isinstance(v, (float, np.floating)):\n                return f'{float(v):.6g}'\n            return repr(v)[:1500]\n    except Exception:\n        return repr(v)[:1500]\n\n\n# ------------------------------------------------------------------ kernel\ndef _clone(ns):\n    out, memo = {}, {}\n    for k, v in ns.items():\n        if isinstance(v, types.ModuleType) or k == '__builtins__':\n            out[k] = v\n            continue\n        try:\n            out[k] = copy.deepcopy(v, memo)\n        except Exception:\n            out[k] = v\n    return out\n\n\ndef _run(src, ns, label='<cell>'):\n    tree = ast.parse(src, label)\n    last = None\n    if tree.body and isinstance(tree.body[-1], ast.Expr):\n        last = ast.Expression(tree.body.pop().value)\n    buf = io.StringIO()\n    with contextlib.redirect_stdout(buf):\n        exec(compile(tree, label, 'exec'), ns)\n        val = eval(compile(last, label, 'eval'), ns) if last is not None else None\n    return val, buf.getvalue()\n\n\ndef _err(e, label):\n    line = None\n    for fr in traceback.extract_tb(e.__traceback__):\n        if fr.filename == label:\n            line = fr.lineno\n    return f\"{type(e).__name__}{f' on line {line}' if line else ''}: {_short(e)}\"\n\n\ndef _rng_get():\n    import random, sys\n    st = {'py': random.getstate(), 'np': np.random.get_state()}\n    if 'torch' in sys.modules:\n        st['torch'] = sys.modules['torch'].get_rng_state()\n    return st\n\n\ndef _rng_set(st):\n    import random, sys\n    random.setstate(st['py']); np.random.set_state(st['np'])\n    if 'torch' in st and 'torch' in sys.modules:\n        sys.modules['torch'].set_rng_state(st['torch'])\n\n\nclass Kernel:\n    def __init__(self):\n        self.reset()\n\n    def reset(self, files=None):\n        self.ns = {'__name__': '__main__'}\n        self.pre = {}\n        self.rng = {}\n        for name, text in (files or {}).items():\n            with open(name, 'w') as f:\n                f.write(text)\n\n    def begin(self, idx):\n        if idx not in self.pre:\n            self.pre[idx] = _clone(self.ns)\n            self.rng[idx] = _rng_get()\n\n    def commit_original(self, idx, src):\n        \"\"\"Run a visible (or revealed) cell as written. Returns its display.\"\"\"\n        self.begin(idx)\n        ns = _clone(self.pre[idx])\n        _rng_set(self.rng[idx])\n        val, out = _run(src, ns)\n        self.ns = ns\n        return dict(ok=True, display=show(val), stdout=out)\n\n    def grade(self, idx, original, user):\n        self.begin(idx)\n        base = self.pre[idx]\n        exp_ns = _clone(base)\n        _rng_set(self.rng[idx])\n        exp_val, exp_out = _run(original, exp_ns)\n        usr_ns = _clone(base)\n        _rng_set(self.rng[idx])\n        try:\n            ast.parse(user, '<your code>')\n        except SyntaxError as e:\n            return dict(ok=False, kind='error', message=f'SyntaxError on line {e.lineno}: {e.msg}')\n        try:\n            usr_val, out = _run(user, usr_ns, '<your code>')\n        except Exception as e:\n            return dict(ok=False, kind='error', message=_err(e, '<your code>'))\n        for name, ev in exp_ns.items():\n            if name.startswith('_') or isinstance(ev, types.ModuleType):\n                continue\n            if name in base:\n                same, _m = compare(base[name], ev)\n                if same and (name in usr_ns):\n                    still, _ = compare(usr_ns[name], ev)\n                    if still:\n                        continue\n                    return dict(ok=False, kind='wrong', message=f'`{name}` was changed, but this cell should leave it alone.', stdout=out)\n            if name not in usr_ns:\n                if _is_tool(ev):\n                    continue\n                return dict(ok=False, kind='wrong', message=f'`{name}` is never created — later cells use that name.', stdout=out)\n            ok, m = compare(usr_ns[name], ev)\n            if not ok:\n                return dict(ok=False, kind='wrong', message=f'`{name}`: {m}.', got=show(usr_ns[name]), expected=show(ev), stdout=out)\n        changed = [n for n in exp_ns if not n.startswith('_') and not isinstance(exp_ns[n], types.ModuleType)\n                   and not _is_tool(exp_ns[n]) and (n not in base or not compare(base[n], exp_ns[n])[0])]\n        if not changed and exp_val is None and exp_out.strip():\n            if out.strip() != exp_out.strip():\n                return dict(ok=False, kind='wrong', message='The printed output differs from the target.', got=out[-1500:], expected=exp_out[-1500:], stdout=out)\n        if exp_val is not None and not isinstance(exp_val, types.ModuleType):\n            if usr_val is None:\n                return dict(ok=False, kind='wrong', message='This cell should end by showing a result (an expression on the last line), like the target output.', stdout=out)\n            ok, m = compare(usr_val, exp_val)\n            if not ok:\n                return dict(ok=False, kind='wrong', message=f'The displayed result differs: {m}.', got=show(usr_val), expected=show(exp_val), stdout=out)\n        for name, ev in exp_ns.items():\n            if name not in usr_ns and (isinstance(ev, types.ModuleType) or _is_tool(ev)):\n                usr_ns[name] = ev\n        self.ns = usr_ns\n        return dict(ok=True, kind='pass', display=show(usr_val), stdout=out)\n\n    def check_task(self, setup_ref, user, var):\n        \"\"\"Interview follow-up: run against the current notebook state; compare one variable.\"\"\"\n        exp_ns = _clone(self.ns)\n        _run(setup_ref, exp_ns)\n        usr_ns = _clone(self.ns)\n        try:\n            val, out = _run(user, usr_ns, '<your code>')\n        except Exception as e:\n            return dict(ok=False, kind='error', message=_err(e, '<your code>'))\n        if var not in usr_ns:\n            return dict(ok=False, kind='wrong', message=f'Store your answer in `{var}`.')\n        ok, m = compare(usr_ns[var], exp_ns[var])\n        return dict(ok=ok, kind='pass' if ok else 'wrong', message='' if ok else f'`{var}`: {m}.',\n                    got=None if ok else show(usr_ns[var]), expected=None if ok else show(exp_ns[var]))\n\n\nKERNEL = Kernel()\n\n\ndef run_notebook(cells, files=None):\n    \"\"\"Run every code cell as written. Returns per-cell display + analysis; stops marking at first failure.\"\"\"\n    k = Kernel(); k.reset(files)\n    res, broken = [], None\n    for i, src in enumerate(cells):\n        a = analyze(src)\n        if broken is not None:\n            res.append(dict(analysis=a, display='', stdout='', runnable=False)); continue\n        try:\n            before = _clone(k.ns)\n            r = k.commit_original(i, src)\n            imported = set()\n            try:\n                for node in ast.walk(ast.parse(src)):\n                    if isinstance(node, (ast.Import, ast.ImportFrom)):\n                        imported |= {(al.asname or al.name).split('.')[0] for al in node.names}\n            except SyntaxError:\n                pass\n            creates = [n for n, v in k.ns.items() if not n.startswith('_') and not isinstance(v, types.ModuleType)\n                       and n not in imported and (n not in before or not compare(before[n], v)[0])]\n            res.append(dict(analysis=a, display=r['display'], stdout=r['stdout'], runnable=True, creates=creates))\n        except Exception as e:\n            broken = i\n            res.append(dict(analysis=a, display='', stdout='', runnable=False, error=_err(e, '<cell>')))\n    return res\n";
const EVALS = {"summary":[{"name":"Answer key passes","what":"Every original cell, run as written, passes its own check (no false alarms).","result":"125 / 125"},{"name":"Correct rewrites pass","what":"Hand-written, different-but-correct versions of cells are accepted (the checker is not too strict).","result":"34 / 34"},{"name":"Injected mistakes caught","what":"Automatic mutations of the forgettable parts (swapped method, dropped argument, changed value, flipped axis, nudged number) are rejected.","result":"332 / 363"},{"name":"…of mistakes that change the result","what":"The 31 uncaught mutations were reviewed one by one: each gives an identical result on this data (e.g. dropping test_size=0.25, which is the default).","result":"332 / 332 (100%)"},{"name":"Blanks map back exactly","what":"Every blank and blanked line the fade engine creates points at exactly the original text.","result":"816 / 816"},{"name":"Interview checks","what":"Each follow-up question: the reference answer passes and a wrong answer fails.","result":"56 / 56"}],"note":"Run offline on Python 3.12 with numpy 1.26.4, pandas 2.2.0, scikit-learn 1.4.2 and SciPy 1.12, the versions Pyodide 0.26.4 loads in the browser. PyTorch notebook checked with real PyTorch."};
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
const STAGES = ["Blanks", "Lines", "Cells", "Blank page"];
const STAGE_HELP = [
  "Key words are blanked: method names, arguments and their values.",
  "Whole lines are blanked. You see what they should produce.",
  "Whole cells are blanked. You get the goal and the target output.",
  "Every code cell is blank. Rebuild the notebook from its outline.",
];
const LIB_ORDER = ["NumPy", "pandas", "scikit-learn", "SciPy stats", "PyTorch"];
const INTERVAL = [1, 2, 4, 8, 16]; // days until revisit after passing stage n (index = stage)

/* ------------------------------------------------------------ utils */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const addDays = (ds, n) => { const d = new Date(ds + "T12:00:00"); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const fmtDate = (ds) => new Date(ds + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
function rand(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const KW = new Set("False None True and as assert break class continue def del elif else for from global if import in is lambda not or pass raise return try while with yield".split(" "));
function hl(text) {
  let out = "", i = 0;
  const re = /(#.*$)|('(?:[^'\\]|\\.)*'?|"(?:[^"\\]|\\.)*"?)|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_]\w*)/gm;
  let m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(i, m.index));
    if (m[1]) out += `<span class="tok-c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tok-s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tok-n">${esc(m[3])}</span>`;
    else out += KW.has(m[4]) ? `<span class="tok-k">${m[4]}</span>` : esc(m[4]);
    i = re.lastIndex;
  }
  return out + esc(text.slice(i));
}

/* ------------------------------------------------------------ state */
const blank = () => ({ v: 1, nb: {}, uploads: [], log: [], rounds: [] });
let S = blank();
try { const raw = localStorage.getItem("fade-state"); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) { }
function save() { try { localStorage.setItem("fade-state", JSON.stringify(S)); } catch (e) { toast("Couldn't save progress in this browser (storage full or blocked)."); } }
function nbState(id) { return S.nb[id] || (S.nb[id] = { stage: 1, maxStage: 1, passes: 0, last: null, due: null, weak: {}, history: [] }); }
function allNotebooks() { return MODULES.concat(S.uploads || []); }
function getNb(id) { return allNotebooks().find((m) => m.id === id); }
function codeCells(nb) { return nb.cells.filter((c) => c.t === "code"); }
function ink(nb) {
  const st = S.nb[nb.id];
  if (!st || !st.last) return 0;
  const interval = INTERVAL[Math.min(4, st.maxStage - 1)] || 1;
  const el = Math.max(0, daysBetween(st.last, today()));
  const base = 0.25 + 0.75 * ((st.maxStage - 1) / 4 + (st.done4 ? 0.25 : 0));
  return Math.max(0.08, Math.min(1, base) * Math.exp(Math.log(0.85) * el / interval));
}
function toast(msg) { console.warn(msg); }

/* ------------------------------------------------------------ python engine (Pyodide in a worker) */

const PY = { seq: 0, ready: false, failed: false, p: null, opened: null, at: 0 };
let pyo = null;
function setEngine(cls, text) { const e = $("#engine"); e.querySelector(".dot").className = "dot " + cls; e.querySelector("span:last-child").textContent = text; }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }
function startPy() { PY.failed = true; PY.p = Promise.resolve(); const e=$("#engine"); if(e) e.remove(); return;
  PY.ready = false; PY.failed = false; PY.opened = null; PY.at = 0;
  setEngine("wait", "Python is starting (about 15 s the first time)…");

function planFor(nb, stage, passNo) {
  const st = nbState(nb.id);
  const r = rand(hashStr(nb.id) + passNo * 7919 + stage * 31);
  const cc = codeCells(nb);
  const plan = cc.map(() => ({ kind: "show" }));
  const runnable = (c) => c.runnable !== false || nb.mode === "read";
  const cand = [];
  cc.forEach((c, ci) => (c.analysis.stmts || []).forEach((s, si) => { if (s.score >= 3 && runnable(c)) cand.push({ ci, si, s, w: (st.weak[ci + ":" + si] || 0) * 10 + s.score / 10 + r() * 2 }); }));

    const take = cand.slice(0, Math.max(1, Math.round(cand.length * (stage === 1 ? 0.55 : 0.5))));
    take.forEach(({ ci, si, s }) => {

      if (stage === 1) {

        const toks = s.tokens.slice().sort((a, b) => (order[a.kind] - order[b.kind]) || (r() - 0.5));

/* ------------------------------------------------------------ library sprint: revise a whole library */
let SP = null;
function startSprint(lib) {
  const mods = MODULES.filter((m) => m.lib === lib && m.mode !== "read");
  const picks = [];
  mods.forEach((m) => {
    const st = S.nb[m.id] || { weak: {} };
    codeCells(m).forEach((c, ci) => {
      const score = (c.analysis.stmts || []).reduce((a, s) => a + s.score, 0);
      if (score < 6) return;
      const weak = Object.keys(st.weak || {}).filter((k) => k.startsWith(ci + ":")).reduce((a, k) => a + st.weak[k], 0);
      picks.push({ m, ci, w: weak * 5 + (S.nb[m.id] ? 0 : 2) + Math.random() * 3 });
    });
  });
  picks.sort((a, b) => b.w - a.w);
  // max 2 per module so the sprint spans the library
  const per = {}, chosen = [];
  for (const p of picks) { if ((per[p.m.id] || 0) >= 2) continue; per[p.m.id] = (per[p.m.id] || 0) + 1; chosen.push(p); if (chosen.length >= 8) break; }
  chosen.sort((a, b) => mods.indexOf(a.m) - mods.indexOf(b.m) || a.ci - b.ci);
  // a sprint is a synthetic notebook view: one cell at a time, kernel replays its module up to that cell
  SP = { lib, items: chosen.map((p) => ({ m: p.m, ci: p.ci, status: "todo", attempts: 0, input: "", result: null, busy: false })), i: 0 };
  go("sprint");
}
function renderSprint() {
  const el = $("#v-nb");

    const ok = SP.items.filter((x) => x.status === "passed" && x.attempts === 1).length;
    el.innerHTML = `<div class="panel"><div class="row" style="align-items:flex-end;gap:18px"><span class="big">${ok}/${SP.items.length}</span><div><h2 style="margin:0">${esc(SP.lib)} sprint done</h2><p class="muted" style="margin:2px 0 0">First-try rebuilds across ${new Set(SP.items.map((x) => x.m.id)).size} notebooks. Misses are marked weak and will be blanked first next time.</p></div></div>
      <div class="tablewrap" style="margin-top:14px"><table class="list"><thead><tr><th>Notebook</th><th>Cell</th><th>Result</th></tr></thead><tbody>${SP.items.map((x) => `<tr><td>${esc(x.m.title)}</td><td><code style="white-space:pre-wrap">${esc(codeCells(x.m)[x.ci].src.split("\n")[0])}${codeCells(x.m)[x.ci].src.includes("\n") ? " …" : ""}</code></td><td>${x.status === "passed" ? (x.attempts === 1 ? "first try" : `after ${x.attempts} tries`) : "peeked"}</td></tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:14px"><button class="btn teal" id="sp-again">Another ${esc(SP.lib)} sprint</button><button class="btn" data-go="shelf">Back to the shelf</button></div></div>`;
    $("#sp-again").onclick = () => startSprint(SP.lib); bindGo(el); return;
  }
  const c = codeCells(it.m)[it.ci];
  const mdBefore = (() => { let k = -1, last = ""; for (const x of it.m.cells) { if (x.t === "md") last = x.src; else { k++; if (k === it.ci) return last; last = ""; } } return ""; })();
  const vis = c.creates || [];
  el.innerHTML = `<div class="nb-head"><div><div class="lib">Revising all of ${esc(SP.lib)}</div><h1>Sprint: ${SP.i + 1} of ${SP.items.length}</h1></div><span class="spacer"></span><span class="meter">from <b>${esc(it.m.title)}</b>, cell [${it.ci + 1}]</span></div>

    ${mdBefore ? `<div class="cell"><div></div><div class="md">${md(mdBefore)}</div></div>` : ""}
    <div class="cell" id="sp-cell"><div class="gutter">[${it.ci + 1}]</div><div class="code-box ${it.status}">
      ${it.status === "passed" || it.status === "peeked" ? `<pre class="code">${hl(it.status === "passed" ? it.input : c.src)}</pre>` : `<textarea class="full" id="sp-in" rows="${Math.max(3, c.src.split("\n").length + 1)}" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Write this cell" placeholder="write this cell from memory">${esc(it.input)}</textarea>`}

      <div class="cell-bar">${it.status === "todo" ? `<button class="btn small ink" id="sp-run" ${it.busy ? "disabled" : ""}>${it.busy ? '<span class="spin"></span> Running' : "Check"}</button><button class="btn small ghost" id="sp-peek">Peek</button>${vis.length ? `<span class="creates">must create ${vis.map((x) => `<code>${esc(x)}</code>`).join(" ")}</span>` : ""}` : `<span class="stamp ${it.status === "peeked" ? "peek" : ""}">${it.status === "passed" ? (it.attempts === 1 ? "Rebuilt first try" : "Rebuilt") : "Peeked"}</span><span class="spacer"></span><button class="btn small teal" id="sp-next">Next ▸</button>`}</div>

  const ta = $("#sp-in");

  const n = $("#sp-next"); if (n) n.onclick = () => { SP.i++; renderSprint(); window.scrollTo({ top: 0 }); };
}
async function spRun() {
  const it = SP.items[SP.i]; const c = codeCells(it.m)[it.ci];
  if (!it.input.trim()) return;
  it.attempts++;
  if (norm(it.input) === norm(c.src)) { it.status = "passed"; spMark(it, it.attempts === 1); } else it.result = { ok: false, kind: "wrong", message: "Not quite. Try again or peek." };
  renderSprint(); return;
  try {
    const key = "sprint:" + it.m.id + ":" + SP.lib;
    if (PY.opened !== key || PY.at > it.ci) { PY.opened = null; }
    await advanceTo(it.m, key, it.ci, null);
    const res = await py("grade", { idx: it.ci, original: c.src, user: it.input }, 90000);
    it.busy = false; it.result = res;
    if (res.ok) { it.status = "passed"; PY.at = it.ci + 1; spMark(it, it.attempts === 1); }
  } catch (e) { it.busy = false; it.result = { ok: false, kind: "error", message: e.message === "engine" ? "Python isn't available here." : e.message }; PY.opened = null; }

}
function spMark(it, clean) {
  const st = nbState(it.m.id);

  S.log.push({ d: today(), nb: it.m.id, cell: it.ci, stage: 3, ok: clean ? 1 : 0, sprint: 1 });
  save();
}

  ${due.length ? `<div class="section-head"><h2>Fading today</h2></div><div class="shelf">${due.map(card).join("")}</div>` : ""}
  ${`<div class="section-head"><h2>Your notebooks</h2></div><div class="shelf">${(S.uploads || []).map(card).join("")}<button class="nb-card upload-card" data-go="upload"><b>+ Add a notebook</b><span>Drop an .ipynb file and its data</span></button></div>`}
  ${libs.map((l) => { const ms = MODULES.filter((m) => m.lib === l); return `<div class="section-head"><h2>${esc(l)}</h2><span class="muted">${ms.length} notebook${ms.length > 1 ? "s" : ""}</span><span class="spacer"></span>${l !== "PyTorch" ? `<button class="btn small" data-sprint="${esc(l)}">Revise all of ${esc(l)} ▸</button>` : ""}</div><div class="shelf">${ms.map(card).join("")}</div>`; }).join("")}
  `;
  el.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openNotebook(b.dataset.open));
  el.querySelectorAll("[data-sprint]").forEach((b) => b.onclick = () => startSprint(b.dataset.sprint));
  bindGo(el);
}

/* ------------------------------------------------------------ upload */
let UP = { busy: false, err: null, msg: null, nb: null, data: {} };
function renderUpload() {
  const el = $("#v-upload");
  el.innerHTML = `<div class="panel"><h2>Add your own notebook</h2>
    <p class="muted">Drop any .ipynb. We'll blank out the key code for you to fill back in.</p>
    <div class="drop" id="drop"><p style="margin:0 0 10px"><b>Drop files here</b> or</p><label class="btn ink" for="files">Choose files</label><input type="file" id="files" multiple accept=".ipynb,.csv,.txt,.json,.tsv" class="hidden"></div>
    ${UP.busy ? `<p style="margin-top:14px"><span class="spin"></span> ${esc(UP.msg || "Working…")}</p>` : ""}
    ${UP.err ? `<p class="err" style="margin-top:14px">${esc(UP.err)}</p>` : ""}
    ${UP.nb ? uploadReport() : ""}</div>`;
  const inp = $("#files"), dz = $("#drop");
  inp.onchange = () => handleFiles([...inp.files]);
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("over"); handleFiles([...e.dataTransfer.files]); };
  const o = $("#up-open"); if (o) o.onclick = () => openNotebook(UP.nb.id);
}
function uploadReport() {
  const nb = UP.nb; const cc = codeCells(nb);
  const ok = cc.filter((c) => c.runnable !== false).length;
  const err = cc.find((c) => c.error);
  return `<div class="panel" style="margin-top:16px;background:var(--code-bg)"><b>${esc(nb.title)}</b><p class="note" style="margin:4px 0 8px">${cc.length} code cells ready.</p><button class="btn teal" id="up-open">Open it at level 1</button></div>`;
}
async function handleFiles(list) {
  UP.err = null;
  const ipynb = list.find((f) => /\.ipynb$/i.test(f.name));
  const data = list.filter((f) => !/\.ipynb$/i.test(f.name));
  try {
    for (const f of data) UP.data[f.name] = await f.text();
    if (!ipynb) { UP.msg = null; UP.err = data.length ? `Added ${data.length} data file(s). Now drop the .ipynb.` : "Choose a .ipynb file."; renderUpload(); return; }
    const j = JSON.parse(await ipynb.text());
    const cells = (j.cells || []).map((c) => ({ t: c.cell_type === "code" ? "code" : "md", src: (Array.isArray(c.source) ? c.source.join("") : c.source || "").replace(/\s+$/, "") }))
      .filter((c) => c.src && c.t !== "raw").map((c) => c.t === "code" ? Object.assign(c, { src: c.src.split("\n").filter((l) => !/^\s*[%!]/.test(l)).join("\n") }) : c).filter((c) => c.src.trim());
    const code = cells.filter((c) => c.t === "code");
    if (!code.length) throw new Error("That notebook has no code cells.");
    UP.busy = true; UP.msg = `Running ${code.length} cells once to record their outputs…`; renderUpload();
    code.forEach((c) => { Object.assign(c, { analysis: jsAnalyze(c.src), display: "", stdout: "", runnable: true, creates: [] }); if (/plt\.|sns\.|\.plot\(/.test(c.src)) c.analysis.stmts.forEach((s) => (s.score = 0)); });
    const title = ipynb.name.replace(/\.ipynb$/i, "").replace(/[_-]+/g, " ");
    const size = JSON.stringify(UP.data).length;
    const nb = { id: "up-" + hashStr(ipynb.name + code.length), lib: "Your notebook", title, data: `${code.length} code cells${Object.keys(UP.data).length ? " · " + Object.keys(UP.data).join(", ") : ""}`, files: [], fileData: size < 2e6 ? UP.data : {}, cells, upload: true, mode: "run" };
    S.uploads = (S.uploads || []).filter((u) => u.id !== nb.id).concat([nb]);
    save();
    UP = { busy: false, err: size >= 2e6 ? "Data files are over 2 MB, so they aren't kept between visits. Add them again next time." : null, msg: null, nb, data: {} };
  } catch (e) { UP.busy = false; UP.err = e.message === "engine" ? "Python couldn't start in this browser, so the notebook can't be run." : "Couldn't read that notebook: " + e.message; }
  renderUpload();
}

/* ------------------------------------------------------------ evals page */
function renderEvals() {
  const el = $("#v-evals");
  const s = EVALS.summary;
  el.innerHTML = `<div class="panel"><h2>How your answers are checked</h2>
    <p>When you run a cell, Fade runs your version and the original, both starting from the same notebook state. A cell counts as rebuilt when every variable the original creates or changes comes out the same in yours, and its displayed output matches. Different code that gets there is fine. Small float noise and dtype differences are ignored.</p>
    <p>Everything runs in Python inside your browser (Pyodide), on the same library versions the evals below used. PyTorch can't run in a browser, so for that notebook you compare your cell with the original.</p>
    <h3 style="font-family:var(--font-display);margin:20px 0 6px">Eval results</h3>
    <div class="tablewrap"><table class="list"><thead><tr><th>What was tested</th><th class="num">Result</th></tr></thead><tbody>
    ${s.map((r) => `<tr><td><b>${esc(r.name)}</b><br><span class="note">${esc(r.what)}</span></td><td class="num">${esc(r.result)}</td></tr>`).join("")}
    </tbody></table></div><p class="note">${esc(EVALS.note)}</p></div>`;
}

function norm(s) { return String(s || "").replace(/#.*$/gm, "").replace(/"/g, "'").replace(/\s+/g, ""); }
function textCheck(i, code) { return norm(code) === norm(codeCells(N.nb)[i].src); }
function jsAnalyze(src) {
  const lines = src.split("\n"); const stmts = [];
  lines.forEach((lt, li) => {
    if (!lt.trim() || /^\s*#/.test(lt)) return;
    const toks = []; let m;
    const re = /\.([A-Za-z_]\w*)\(|\b([A-Za-z_]\w*)=(?!=)|import\s+([A-Za-z_]\w*)/g;
    while ((m = re.exec(lt))) {
      if (m[1] && !["head", "tail", "copy", "append", "format"].includes(m[1])) toks.push({ line: li + 1, col: m.index + 1, text: m[1], kind: "method" });
      else if (m[2]) toks.push({ line: li + 1, col: m.index, text: m[2], kind: "kwarg" });
      else if (m[3]) toks.push({ line: li + 1, col: m.index + m[0].length - m[3].length, text: m[3], kind: "import" });
    }
    stmts.push({ start: li + 1, end: li + 1, tokens: toks, score: toks.length * 3, src: lt });
  });
  return { ok: true, stmts };
}
/* routing */
let current = "shelf";
function go(view) {
  current = view;
  const tab = view === "sprint" ? "nb" : view;
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.go === tab ? "true" : "false"));
  ["shelf", "nb", "interview", "upload", "evals"].forEach((v) => $("#v-" + v).classList.toggle("hidden", v !== tab));
  try { history.replaceState(null, "", view === "shelf" ? location.pathname + location.search : "#" + tab); } catch (e) { }
  refresh();
  window.scrollTo({ top: 0 });
}
function refresh() {
  if (current === "shelf") renderShelf();
  else if (current === "nb") renderNotebook();
  else if (current === "sprint") { if (SP) renderSprint(); else renderNotebook(); }
  else if (current === "interview") renderInterview();
  else if (current === "upload") renderUpload();
  else if (current === "evals") renderEvals();
}
function bindGo(el) { el.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go)); }
bindGo(document.querySelector("header"));
$("#home-link").onclick = () => go("shelf");
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["nb", "interview", "upload", "evals"].includes(h) && h !== current) go(h); });
const h0 = location.hash.slice(1);
go(["interview", "upload", "evals"].includes(h0) ? h0 : "shelf");
startPy();
</script>
